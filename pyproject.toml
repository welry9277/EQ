[project]
name = "eq-generator"
version = "0.1.0"
description = "EQ Generation Pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai",
    "tqdm",
    "python-dotenv",
    "torch",
    "transformers",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eq_generation"]
