[project]
name = "eq-generator"
version = "0.1.0"
description = "EQ Generation Pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "tqdm",
    "python-dotenv",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
hf = [
    "datasets>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eq_generation"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["eq_generation", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates contain long example lines by design.
"eq_generation/generators/prompts.py" = ["E501"]
