[project]
name = "eq"
version = "0.1.0"
description = "LLM-based toolkit for generating Extended Query (EQ) data for audio retrieval"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "accelerate",
    "datasets<4.0.0",
    "einops",
    "huggingface-hub",
    "librosa",
    "loguru",
    "matplotlib",
    "msclap>=1.3.4",
    "nnaudio",
    "numpy",
    "openai",
    "pandas",
    "python-dotenv",
    "pyyaml>=6.0",
    "resampy",
    "ruamel-yaml",
    "scikit-learn",
    "seaborn",
    "sed-scores-eval==0.0.0",
    "sentence-transformers",
    "setuptools<70.0.0",
    "timm",
    "torch>=2.8.0",
    "torchaudio>=2.6.0",
    "torchlibrosa",
    "tqdm",
    "transformers",
    "wandb",
]

[project.optional-dependencies]
hf = ["datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eq_generation", "src/clap_eval"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu124-win", marker = "sys_platform == 'win32'" },
    { index = "pytorch-mac", marker = "sys_platform == 'darwin'" }
]
torchaudio = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu124-win", marker = "sys_platform == 'win32'" },
    { index = "pytorch-mac", marker = "sys_platform == 'darwin'" }
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124-win"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-mac"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["eq_generation", "clap_eval"]
